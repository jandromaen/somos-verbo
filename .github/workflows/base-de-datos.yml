# Aplica las migraciones y carga el seed en Supabase.
# Se lanza a mano: GitHub → Actions → «Base de datos» → Run workflow.
# Necesita tres secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal de Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   id del proyecto (Project Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos elegida al crear el proyecto
name: Base de datos

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Cargar también el seed (versículos, colecciones y productos)'
        type: boolean
        default: true

concurrency: base-de-datos

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar que el seed está al día
        run: npm run db:seed:generate -- --check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Enlazar el proyecto
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Aplicar migraciones${{ inputs.seed && ' y seed' || '' }}
        run: supabase db push ${{ inputs.seed && '--include-seed' || '' }}
