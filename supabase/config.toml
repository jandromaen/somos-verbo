# Configuración del CLI de Supabase (https://supabase.com/docs/guides/cli).
# Solo se usa para aplicar migraciones y seed; el proyecto real se enlaza con
# `supabase link --project-ref <ref>` desde el workflow «Base de datos».
project_id = "somos-verbo"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]
